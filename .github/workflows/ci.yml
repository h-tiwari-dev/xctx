# Checks every push and pull request with `mise run ci`, then builds xctx.app. Pushes to main also replace the
# `nightly` pre-release with that build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  ci:
    # One macOS job for checks and the build: macOS arm64 runners are scarce, so every extra job is another wait
    # for one.
    name: fmt, clippy, tests, xctx.app
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ci
      - run: mise run ci
      - run: mise run bundle
      - name: Zip the app
        run: ditto -c -k --keepParent xctx.app xctx-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: xctx-macos-arm64
          path: xctx-macos-arm64.zip
          if-no-files-found: error

  nightly:
    name: publish nightly
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xctx-macos-arm64
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly xctx-macos-arm64.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "xctx nightly" \
            --notes "Built from ${GITHUB_SHA} on main. Apple silicon only, ad-hoc signed: after unzipping, run \`xattr -dr com.apple.quarantine xctx.app\` before opening it."
