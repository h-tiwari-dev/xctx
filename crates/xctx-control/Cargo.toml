[package]
name = "xctx-control"
version.workspace = true
edition.workspace = true
description = "The xctx control socket: JSON-RPC 2.0 over newline-delimited JSON on a Unix socket, its server and client, and the xctx-ctl CLI"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xctx-core = { path = "../xctx-core" }
xctx-layout = { path = "../xctx-layout" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "xctx-ctl"
path = "src/bin/xctx-ctl.rs"
