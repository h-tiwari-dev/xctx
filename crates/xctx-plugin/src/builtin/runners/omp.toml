# omp (oh-my-pi), the agent xctx runs by default. omp cannot create a session under an id xctx chooses (it has no
# `--session-id`), so xctx cannot open or fork its sessions, and attempts are not offered for it; pick the `pi`
# runner for a space or lane that needs attempts.
name = "omp"
description = "omp coding agent: a task and resume, without named sessions or forks (no attempts)"
program = "omp"

# xctx runs omp as an RPC child (`omp --mode rpc-ui`), so its agent state reaches the Roster, Flow and Inbox. Each
# agent gets its own `--session-dir` under xctx's data directory, so its session resumes there; "Open in terminal"
# runs omp's own terminal UI on the same session (`--resume <id> --session-dir <dir>`).
interface = "rpc"

# The first message follows `--`: `omp -- <task>`.
task = { style = "after-double-dash" }

# Resume the worktree's most recent session.
resume = ["--continue"]

# xctx's agent skills (such as opening the space's browser beside the agent), through an `omp --config` overlay
# that lists the skills folder in `skills.customDirectories`.
skills = ["--config", "{skills_dir}/omp-config.yml"]
