[package]
name = "xctx-plugin"
version.workspace = true
edition.workspace = true
description = "xctx plugins: manifests (parse, validate, the built-in first-party ones), the registry of built-in, user and repo plugins, the tool runner (argv templating without a shell, timeouts, output caps, masking, MISE_ENV scope checks) and event matching"

[dependencies]
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
xctx-core = { path = "../xctx-core" }

[dev-dependencies]
tempfile = "3"
