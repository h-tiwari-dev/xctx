[package]
name = "xctx-plugin-view"
version.workspace = true
edition.workspace = true
description = "GPUI panes for xctx's first-party plugins: the API client, logs, read-only database and browser"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
pulldown-cmark = { version = "0.13", default-features = false }
xctx-ui = { path = "../xctx-ui" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }
