[package]
name = "xctx-plugin-view"
version.workspace = true
edition.workspace = true
description = "GPUI panes for xctx's first-party plugins: the API client, logs, read-only database and browser"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3" }
xctx-ui = { path = "../xctx-ui" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3", features = ["test-support"] }
