[package]
name = "xctx-ui"
version.workspace = true
edition.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-component = { version = "0.11.0", features = ["syntect"] }
gpui-kit-assets = "0.11.0"
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
xctx-channel = { path = "../xctx-channel" }
xctx-graph = { path = "../xctx-graph" }
xctx-layout = { path = "../xctx-layout" }
xctx-nav = { path = "../xctx-nav" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }
