[package]
name = "xctx-ui"
version.workspace = true
edition.workspace = true

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3", features = ["font-kit", "runtime_shaders"] }
xctx-channel = { path = "../xctx-channel" }
xctx-graph = { path = "../xctx-graph" }
xctx-layout = { path = "../xctx-layout" }
xctx-nav = { path = "../xctx-nav" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3", features = ["test-support"] }
