[package]
name = "xctx-browser"
version.workspace = true
edition.workspace = true
description = "A minimal Chrome DevTools protocol client: start or attach to Chrome, open a page, take a screenshot, collect console and network errors"

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
url = "2"

[dev-dependencies]
tempfile = "3"
