[package]
name = "xctx-web-view"
version.workspace = true
edition.workspace = true
description = "A live WKWebView inside a GPUI window: placed over a pane, driven by scripts, with its console captured"

[dependencies]
block2 = "0.6"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSBitmapImageRep", "NSEvent", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKScriptMessage", "WKScriptMessageHandler", "WKSnapshotConfiguration", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
raw-window-handle = "0.6"
serde_json = "1"
xctx-browser = { path = "../xctx-browser" }
