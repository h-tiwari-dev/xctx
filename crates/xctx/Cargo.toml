[package]
name = "xctx"
version.workspace = true
edition.workspace = true

[dependencies]
futures = "0.3"
libc = "0.2"
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false, features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xctx-attempt = { path = "../xctx-attempt" }
xctx-browser = { path = "../xctx-browser" }
xctx-channel = { path = "../xctx-channel" }
xctx-connectors = { path = "../xctx-connectors" }
xctx-control = { path = "../xctx-control" }
xctx-core = { path = "../xctx-core" }
xctx-graph = { path = "../xctx-graph" }
xctx-http = { path = "../xctx-http" }
xctx-inbox = { path = "../xctx-inbox" }
xctx-layout = { path = "../xctx-layout" }
xctx-nav = { path = "../xctx-nav" }
xctx-omp = { path = "../xctx-omp" }
xctx-omp-view = { path = "../xctx-omp-view" }
xctx-plugin = { path = "../xctx-plugin" }
xctx-plugin-view = { path = "../xctx-plugin-view" }
xctx-term = { path = "../xctx-term" }
xctx-term-view = { path = "../xctx-term-view" }
xctx-web-view = { path = "../xctx-web-view" }
xctx-ui = { path = "../xctx-ui" }

[dev-dependencies]
tempfile = "3"
