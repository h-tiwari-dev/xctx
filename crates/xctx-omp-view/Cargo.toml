[package]
name = "xctx-omp-view"
version.workspace = true
edition.workspace = true
description = "The native omp chat pane: transcript, tool cards, composer, queue, HUD and error banner over an xctx-omp SessionModel"

[dependencies]
base64 = "0.22"
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3" }
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
xctx-omp = { path = "../xctx-omp" }
xctx-ui = { path = "../xctx-ui" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3", features = ["test-support"] }
tempfile = "3"
