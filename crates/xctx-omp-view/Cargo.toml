[package]
name = "xctx-omp-view"
version.workspace = true
edition.workspace = true
description = "The native omp chat pane: transcript, tool cards, composer, queue, HUD and error banner over an xctx-omp SessionModel"

[dependencies]
base64 = "0.22"
gpui = { package = "gpui-pre", version = "=0.3.14" }
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
xctx-omp = { path = "../xctx-omp" }
xctx-ui = { path = "../xctx-ui" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }
tempfile = "3"
